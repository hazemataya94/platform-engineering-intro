apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-backend-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: platform-engineering-session
data:
  sample-backend-dashboard.json: |
    {
      "title": "Sample Backend",
      "uid": "platform-sample-backend",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "type": "timeseries",
          "title": "Request rate",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum(rate(platform_http_requests_total[1m])) by (endpoint)",
              "legendFormat": "{{endpoint}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Request latency p95",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(platform_http_request_duration_seconds_bucket[5m])) by (le, endpoint))",
              "legendFormat": "{{endpoint}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Business events",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum(rate(platform_business_events_total[1m])) by (event_type)",
              "legendFormat": "{{event_type}}"
            }
          ]
        }
      ]
    }
