name: sample-backend
namespace: platform-apps

image:
  repository: platform-engineering-sample-backend
  tag: local
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  name: sample-backend

service:
  port: 80
  targetPort: 8080

containerPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

probes:
  enabled: true
  path: /healthz

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 15s

vault:
  enabled: true
  role: sample-backend
  secretPath: secret/data/sample-backend/config
  secretFileName: api_token

env:
  APP_SECRET_FILE: /vault/secrets/api_token
  # Set false only for local image bring-up before Vault wiring is ready.
  REQUIRE_APP_SECRET: "true"

podLabels: {}
