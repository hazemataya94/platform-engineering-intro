name: sample-backend
namespace: platform-apps

image:
  repository: platform-engineering-sample-backend
  tag: local
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  name: sample-backend

service:
  port: 80
  targetPort: 8080

containerPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

probes:
  enabled: true
  path: /healthz

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 15s

vault:
  enabled: true
  role: sample-backend
  # Vault KV v2 path (includes /data/ for Agent Injector reads).
  secretPath: secret/data/sample-backend/config
  # Field name inside that Vault secret (vault kv put ... <secretKey>=...).
  secretKey: api_token
  # Filename written under /vault/secrets/ by the injector.
  secretFileName: api_token
  # How often the Agent sidecar re-renders static KV secrets into the file.
  staticSecretRenderInterval: 15s

env:
  # Set false only for local image bring-up before Vault wiring is ready.
  REQUIRE_APP_SECRET: "true"

podLabels: {}
